# Brain host: Ollama plus (optionally) the containerised API and worker.
# Native systemd + uv is the default for companion services; use the api/worker services
# here only if you prefer containers. Ollama settings keep one model loaded and one request
# at a time so a background transcription cannot evict the chat model.
#
#   docker compose -f deploy/compose/brain.yml up -d ollama            # Ollama only
#   docker compose -f deploy/compose/brain.yml --profile containers up -d
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"      # change to LAN_IP:11434 only if the vault/desk hosts must reach it directly
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    # GPU (NVIDIA, with the container toolkit installed): uncomment
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  companion-api:
    profiles: ["containers"]
    build: { context: ../.., dockerfile: deploy/docker/Dockerfile }
    image: companion:local
    container_name: companion-api
    restart: unless-stopped
    command: ["companion-api", "serve", "--host", "0.0.0.0"]
    env_file: ../../.env
    environment:
      COMPANION_CONFIG: /app/config/local.yaml
    volumes:
      - ../../config:/app/config:ro
      - ../../data:/app/data
    ports:
      - "8710:8710"
    depends_on: [ollama]

  companion-worker:
    profiles: ["containers"]
    image: companion:local
    container_name: companion-worker
    restart: unless-stopped
    command: ["companion-worker", "run"]
    env_file: ../../.env
    environment:
      COMPANION_CONFIG: /app/config/local.yaml
    volumes:
      - ../../config:/app/config:ro
      - ../../data:/app/data
    depends_on: [companion-api]

volumes:
  ollama-models: {}
