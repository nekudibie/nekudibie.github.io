# Neku's desk companion - example configuration (one development machine).
#
# Copy to config/local.yaml and edit. Secrets never go here: *_env fields name an
# environment variable, loaded from .env in the repository root (see .env.example).
# Every provider below defaults to "fixture" so the stack runs with no hardware;
# fixtures are always labelled as such in the API and the desk UI.

instance:
  name: companion-dev
  timezone: Europe/London
  data_dir: ./data            # databases, media, caches (local disk only; never SMB/NFS)
  environment: development
  owner_name: Neku

logging:
  level: INFO
  format: text                # json in production

api:
  host: 127.0.0.1             # bind to the LAN address only when TLS/firewalling is in place (docs/SECURITY.md)
  port: 8710
  cors_origins: ["http://localhost:5173"]   # Vite dev server; not needed when the API serves the built UI
  serve_desk_ui: true

vault:
  mode: embedded              # embedded = inside the API process (one host); remote = separate vault host
  url: http://127.0.0.1:8720  # used when mode: remote
  token_env: COMPANION_VAULT_TOKEN

brain: {}                     # db_path / media_dir default to data_dir/brain

worker:
  embedded: true              # run jobs inside the API process in development; false on real hosts
  concurrency: 2

llm:
  provider: fixture           # fixture | ollama   (no cloud providers exist on purpose)
  base_url: http://127.0.0.1:11434
  model: ""                   # e.g. a tool-capable model you have pulled; check `ollama list` and `/api/show` capabilities
  timeout_s: 90
  keep_alive: 10m
  num_ctx: 8192
  max_tool_rounds: 4

home:
  provider: fixture           # fixture | home_assistant | disabled
  base_url: http://homeassistant.local:8123
  token_env: COMPANION_HA_TOKEN
  allowed_entities: []        # explicit allowlist, e.g. [light.desk_lamp, scene.study, camera.front_door]
  scenes: {}                  # "study lighting": scene.study
  aliases: {}                 # "desk lamp": light.desk_lamp
  cameras: {}                 # "front door": camera.front_door

stt:
  provider: fixture           # fixture | faster_whisper | disabled
  model: base
  compute_type: int8

tts:
  provider: fixture           # fixture | piper | disabled
  voice: en_GB-alan-medium

wake_word:
  enabled: false

weather:
  provider: fixture           # fixture | open_meteo | disabled
  latitude: null
  longitude: null
  location_name: ""

email:
  provider: fixture           # fixture | gmail | disabled  (read-only; see docs/OPERATIONS.md for OAuth setup)

mtg:
  provider: fixture           # fixture | scryfall | disabled

tutor:
  enabled: true

robotics:
  mode: simulated             # simulated | disabled  (there is no live mode in this codebase yet)

clients:
  - id: desk
    role: desk                # full assistant minus admin
    label: Desk screen
    token_env: COMPANION_DESK_TOKEN
  - id: admin
    role: owner
    label: Owner admin
    token_env: COMPANION_ADMIN_TOKEN
  # - id: rover
  #   role: rover             # narrow: robot commands, memory read, weather, maths
  #   token_sha256: "<sha256 of the rover token>"
