[project]
name = "companion-contracts"
version = "0.1.0"
description = "Typed request, event and tool schemas shared by every role."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["companion_contracts"]
