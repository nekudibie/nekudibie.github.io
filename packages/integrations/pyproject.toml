[project]
name = "companion-integrations"
version = "0.1.0"
description = "Adapters: Ollama, Home Assistant, weather, email, card data."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "companion-core",
    "companion-contracts",
    "companion-vault",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Heavy, host-specific extras: install only on the brain host.
stt = ["faster-whisper>=1.1"]
tts = ["piper-tts>=1.3"]
wakeword = ["openwakeword>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["companion_integrations"]

[tool.uv.sources]
companion-core = { workspace = true }
companion-contracts = { workspace = true }
companion-vault = { workspace = true }
companion-integrations = { workspace = true }
companion-tutor = { workspace = true }
companion-robotics = { workspace = true }
