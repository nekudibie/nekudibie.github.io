[project]
name = "companion-core"
version = "0.1.0"
description = "Shared infrastructure: config, logging, SQLite, auth primitives, ids, clock."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["companion_core"]
