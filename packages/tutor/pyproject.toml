[project]
name = "companion-tutor"
version = "0.1.0"
description = "Lesson planning, exercises and progress tracking."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "companion-core",
    "companion-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["companion_tutor"]

[tool.uv.sources]
companion-core = { workspace = true }
companion-contracts = { workspace = true }
companion-vault = { workspace = true }
companion-integrations = { workspace = true }
companion-tutor = { workspace = true }
companion-robotics = { workspace = true }
