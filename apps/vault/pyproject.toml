[project]
name = "companion-vault"
version = "0.1.0"
description = "Memory vault: documents, structured memory and retrieval API."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "companion-core",
    "companion-contracts",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
companion-vault = "companion_vault.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["companion_vault"]

[tool.uv.sources]
companion-core = { workspace = true }
companion-contracts = { workspace = true }
companion-vault = { workspace = true }
companion-integrations = { workspace = true }
companion-tutor = { workspace = true }
companion-robotics = { workspace = true }
