[project]
name = "companion-worker"
version = "0.1.0"
description = "Persistent job execution and schedules."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "companion-core",
    "companion-contracts",
    "companion-vault",
    "companion-integrations",
    "companion-tutor",
]

[project.scripts]
companion-worker = "companion_worker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["companion_worker"]

[tool.uv.sources]
companion-core = { workspace = true }
companion-contracts = { workspace = true }
companion-vault = { workspace = true }
companion-integrations = { workspace = true }
companion-tutor = { workspace = true }
companion-robotics = { workspace = true }
