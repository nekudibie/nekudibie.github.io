[project]
name = "companion-api"
version = "0.1.0"
description = "Orchestration API: auth, conversations, tool gateway, desk UI host."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "companion-core",
    "companion-contracts",
    "companion-vault",
    "companion-integrations",
    "companion-tutor",
    "companion-robotics",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
companion-api = "companion_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["companion_api"]

[tool.uv.sources]
companion-core = { workspace = true }
companion-contracts = { workspace = true }
companion-vault = { workspace = true }
companion-integrations = { workspace = true }
companion-tutor = { workspace = true }
companion-robotics = { workspace = true }
