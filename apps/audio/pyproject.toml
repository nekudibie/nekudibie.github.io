[project]
name = "companion-audio"
version = "0.1.0"
description = "Native Linux/Pi audio client: push-to-talk capture and playback."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "companion-core",
    "companion-contracts",
    "httpx>=0.27",
]

[project.scripts]
companion-audio = "companion_audio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["companion_audio"]

[tool.uv.sources]
companion-core = { workspace = true }
companion-contracts = { workspace = true }
companion-vault = { workspace = true }
companion-integrations = { workspace = true }
companion-tutor = { workspace = true }
companion-robotics = { workspace = true }
